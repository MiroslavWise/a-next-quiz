name: Deploy to Vercel & Notify Telegram

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.16.0"

      # 👇 ДОБАВЬТЕ ЭТОТ ШАГ
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "10.25.0"
          run_install: false

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build Project Artifacts
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy Project Artifacts to Vercel
        id: deploy
        run: |
          url=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$url" >> $GITHUB_OUTPUT

      - name: Send Telegram Notification (Success)
        id: notify
        if: success()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
        run: |
          node --input-type=module <<'EOF'
          import { execSync } from "node:child_process"
          import { readFileSync } from "node:fs"

          function escapeMd(text) {
            return text.replace(/([_*`\[])/g, "\\$1")
          }

          function bulletsFromText(text) {
            const bullets = []
            for (const raw of text.split(/\r?\n/)) {
              const match = /^-\s+(.+)$/.exec(raw.trim())
              if (!match?.[1]?.trim()) continue
              bullets.push(match[1].trim())
            }
            return bullets
          }

          function bulletsFromGitNext() {
            let content = ""
            try {
              content = readFileSync(".git-next.md", "utf8")
            } catch {
              return []
            }

            const lines = content.split(/\r?\n/)
            const start = lines.findIndex((line) => /^##\s+Изменения\s*$/i.test(line.trim()))
            if (start === -1) return []

            const section = []
            for (const line of lines.slice(start + 1)) {
              if (/^##\s+/.test(line.trim())) break
              section.push(line)
            }
            return bulletsFromText(section.join("\n"))
          }

          const commitMsg = execSync("git log -1 --format=%B", { encoding: "utf8" }).trim()
          const versionLine = commitMsg.split(/\r?\n/, 1)[0]?.trim() ?? ""
          const version = /^\d+\.\d+\.\d+/.test(versionLine) ? versionLine : ""

          // npm run git переносит пункты из .git-next.md в коммит и сбрасывает файл до push.
          let bullets = bulletsFromText(commitMsg.split(/\r?\n/).slice(1).join("\n"))
          if (!bullets.length) bullets = bulletsFromGitNext()

          const parts = ["✅ *Деплой успешен!*"]
          if (version) parts.push(`\`${escapeMd(version)}\``)
          if (bullets.length) {
            parts.push(bullets.map((item) => `- ${escapeMd(item)}`).join("\n"))
          }
          if (process.env.DEPLOY_URL) parts.push(escapeMd(process.env.DEPLOY_URL))

          const text = parts.join("\n\n").slice(0, 4000)
          console.log(text)

          const response = await fetch(
            `https://api.telegram.org/bot${process.env.TELEGRAM_BOT_TOKEN}/sendMessage`,
            {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                chat_id: process.env.TELEGRAM_CHAT_ID,
                text,
                parse_mode: "Markdown",
                disable_web_page_preview: true,
              }),
            },
          )

          const data = await response.json()
          if (!response.ok || !data.ok) {
            console.error(JSON.stringify(data))
            process.exit(1)
          }
          EOF

      - name: Send Telegram Notification (Failure)
        if: failure() && steps.notify.outcome != 'failure'
        run: |
          curl -s -X POST https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage \
            -H "Content-Type: application/json" \
            -d '{
              "chat_id": "${{ secrets.TELEGRAM_CHAT_ID }}",
              "text": "❌ *Ошибка деплоя!*\nПроект: `${{ github.repository }}`\nПроверьте логи в GitHub Actions: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}",
              "parse_mode": "Markdown"
            }'
